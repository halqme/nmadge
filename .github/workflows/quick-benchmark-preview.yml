name: Quick Benchmark Preview

on:
  push:
    branches:
      - ci/benchmark-quick-mode

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HONO_REPOSITORY: https://github.com/honojs/hono.git
      HONO_COMMIT: 098e11912ab244c5c33931de007f04dc8e3c2929
      WEBPACK_REPOSITORY: https://github.com/webpack/webpack.git
      WEBPACK_COMMIT: e9e02fb312a904c04e151ebd08aaa03364a31513
      MADGE_VERSION: 8.0.0
      DPDM_VERSION: 4.3.0
      NODE_VERSION: 24.x
      BUN_VERSION: 1.4.2
      HYPERFINE_VERSION: 1.19.0
      RUNNER_LABEL: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: hyperfine@1.19.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Prepare fixed benchmark corpora
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/oxdg-benchmark"
          hono_dir="$workspace/hono"
          webpack_dir="$workspace/webpack"
          mkdir -p "$workspace"

          git init -q "$hono_dir"
          git -C "$hono_dir" remote add origin "$HONO_REPOSITORY"
          git -C "$hono_dir" fetch --depth 1 origin "$HONO_COMMIT"
          git -C "$hono_dir" checkout --detach "$HONO_COMMIT"

          git init -q "$webpack_dir"
          git -C "$webpack_dir" remote add origin "$WEBPACK_REPOSITORY"
          git -C "$webpack_dir" fetch --depth 1 origin "$WEBPACK_COMMIT"
          git -C "$webpack_dir" checkout --detach "$WEBPACK_COMMIT"

          {
            echo "BENCHMARK_WORKSPACE=$workspace"
            echo "HONO_DIR=$hono_dir"
            echo "WEBPACK_DIR=$webpack_dir"
          } >> "$GITHUB_ENV"
      - name: Pack main
        run: node scripts/package-footprint.mjs --output "$BENCHMARK_WORKSPACE/packs/oxdg" --report benchmark-package-footprint.json
      - name: Install benchmark packages
        run: node scripts/benchmark-packages.mjs --workspace "$BENCHMARK_WORKSPACE" --locks benchmark-package-locks --package-footprint benchmark-package-footprint.json --release-footprint benchmark-release-footprint.json
      - name: Run full-corpus quick benchmark
        run: node scripts/benchmark-runner.mjs --hono-dir "$HONO_DIR" --webpack-dir "$WEBPACK_DIR" --workspace "$BENCHMARK_WORKSPACE" --main-package-footprint benchmark-package-footprint.json --release-package-footprint benchmark-release-footprint.json --warmup 2 --runs 5 --output .
      - name: Generate report
        run: node scripts/benchmark-report.mjs --hono-directory benchmark-hono-directory.json --hono-entrypoint benchmark-hono-entrypoint.json --webpack-directory benchmark-webpack-directory.json --webpack-entrypoint benchmark-webpack-entrypoint.json --metadata benchmark-metadata.json --output benchmark-report
      - name: Verify quick metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const metadata = JSON.parse(readFileSync("benchmark-metadata.json", "utf8"));
          if (metadata.benchmark.warmup !== 2 || metadata.benchmark.runs !== 5) {
            throw new Error("quick benchmark iteration counts are wrong");
          }
          if (metadata.corpora.hono.workloads.directory.files < 300) {
            throw new Error("Hono corpus is not the real fixed corpus");
          }
          if (metadata.corpora.webpack.workloads.directory.files < 700) {
            throw new Error("Webpack corpus is not the real fixed corpus");
          }
          console.log(`Hono files: ${metadata.corpora.hono.workloads.directory.files}`);
          console.log(`Webpack files: ${metadata.corpora.webpack.workloads.directory.files}`);
          NODE

name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HONO_REPOSITORY: https://github.com/honojs/hono.git
      HONO_COMMIT: 098e11912ab244c5c33931de007f04dc8e3c2929
      MADGE_VERSION: 8.0.0
      DPDM_VERSION: 4.3.0
      NODE_VERSION: 24.x
      BUN_VERSION: 1.4.2
      HYPERFINE_VERSION: 1.19.0
      RUNNER_LABEL: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install hyperfine
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: hyperfine@${{ env.HYPERFINE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build current oxdg
        run: bun run build

      - name: Prepare fixed Hono workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/oxdg-benchmark"
          hono_dir="$workspace/hono"
          mkdir -p "$workspace"
          git init -q "$hono_dir"
          git -C "$hono_dir" remote add origin "$HONO_REPOSITORY"
          git -C "$hono_dir" fetch --depth 1 origin "$HONO_COMMIT"
          git -C "$hono_dir" checkout --detach "$HONO_COMMIT"
          test "$(git -C "$hono_dir" rev-parse HEAD)" = "$HONO_COMMIT"
          {
            echo "BENCHMARK_WORKSPACE=$workspace"
            echo "HONO_DIR=$hono_dir"
          } >> "$GITHUB_ENV"

      - name: Check package and report footprint
        run: node scripts/package-footprint.mjs --output "$BENCHMARK_WORKSPACE/packs/oxdg" --report benchmark-package-footprint.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Install comparison tools and save dependency locks
        run: node scripts/benchmark-packages.mjs --workspace "$BENCHMARK_WORKSPACE" --locks benchmark-package-locks --package-footprint benchmark-package-footprint.json

      - name: Run both benchmark workloads and record metadata
        run: node scripts/benchmark-runner.mjs --hono-dir "$HONO_DIR" --workspace "$BENCHMARK_WORKSPACE" --package-footprint benchmark-package-footprint.json --output .

      - name: Generate benchmark report and Actions Summary
        run: node scripts/benchmark-report.mjs --directory benchmark-directory.json --entrypoint benchmark-entrypoint.json --metadata benchmark-metadata.json --output benchmark-report --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark
          if-no-files-found: error
          path: |
            benchmark-directory.json
            benchmark-entrypoint.json
            benchmark-metadata.json
            benchmark-commands.json
            benchmark-package-footprint.json
            benchmark-package-locks/
            benchmark-report/
            bun.lock

  publish-report:
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Download benchmark artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark
          path: benchmark-artifact

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: benchmark-artifact/benchmark-report

      - name: Deploy benchmark report
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
